name: DopamineMenu
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.dopaminemenu
    APP_STORE_ID: "6839767610"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DopamineMenu:
    type: application
    platform: iOS
    sources: [DopamineMenu, Shared]
    dependencies:
      - target: DopamineMenuWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DopamineMenu AppStore
    entitlements:
      path: DopamineMenu/DopamineMenu.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.dopaminemenu]
    info:
      path: DopamineMenu/Info.plist
      properties:
        CFBundleDisplayName: Dopamine Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.dopaminemenu.widget
            CFBundleURLSchemes: [dopaminemenu]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
  DopamineMenuWidget:
    type: app-extension
    platform: iOS
    sources:
      - DopamineMenuWidget
      - path: Shared
        includes: [WidgetRoute.swift, L10n.swift, Localizable.xcstrings, DesignPalette.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DopamineMenu Widget AppStore
    entitlements:
      path: DopamineMenuWidget/DopamineMenuWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.dopaminemenu]
    info:
      path: DopamineMenuWidget/Info.plist
      properties:
        CFBundleDisplayName: Dopamine Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DopamineMenuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DopamineMenuTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  DopamineMenuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DopamineMenuUITests]
    dependencies:
      - target: DopamineMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DopamineMenu
schemes:
  DopamineMenu:
    build:
      targets:
        DopamineMenu: all
        DopamineMenuTests: [test]
    test:
      config: Debug
      targets: [DopamineMenuTests]
  DopamineMenuUI:
    build:
      targets:
        DopamineMenu: all
        DopamineMenuUITests: [test]
    test:
      config: Debug
      targets: [DopamineMenuUITests]
